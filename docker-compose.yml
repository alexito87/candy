services:
  postgres:
    image: postgres:16-alpine
    container_name: candy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: candy
      POSTGRES_PASSWORD: candy_password
      POSTGRES_DB: candy
    ports:
      - "5432:5432"
    volumes:
      - candy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candy -d candy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: candy-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://candy:candy_password@postgres:5432/candy?schema=public
      FRONTEND_URL: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: candy-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: candy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5066:80"
    depends_on:
      - postgres

volumes:
  candy_postgres_data: